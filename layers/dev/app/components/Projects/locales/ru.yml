ManeTalkOverview: Разработал сайт ManeTalk с SSO-аутентификацией и микросервисным backend для игровых модулей. Спроектировал масштабируемые REST и событийно-ориентированные API для управления данными профилей, текстурами персонажей, инвентарём и чатом в реальном времени с интеграцией с Godot Engine. Реализовал продвинутые системы защиты от злоупотреблений, включая ограничение запросов на уровне отдельных endpoint'ов, классификацию сообщений с использованием gibberish-фильтрации и Detoxify, а также обнаружение спама и флуда от нескольких аккаунтов с использованием алгоритма Longest Common Subsequence. Разработал Telegram-бота для администрирования и модерации, а также игровой лаунчер для ПК со встроенной системой защиты от читов.
