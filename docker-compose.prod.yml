# config for github actions

# x-common-env: &common-env
#   DATA_DIR: ${DATA_DIR}

# x-postgres-env: &postgres-env
#   environment:
#     <<: *common-env
#     PG_DB: ${PG_DB}
#     PG_PASS: ${PG_PASS}
#     PG_USER: ${PG_USER}
#     PG_LOCAL_PORT: ${PG_LOCAL_PORT}
#     DATABASE_URL: ${DATABASE_URL}

# x-redis-env: &redis-env
#   environment:
#     <<: *common-env
#     REDIS_PASSWORD: ${REDIS_PASSWORD}
#     REDIS_LOCAL_PORT: ${REDIS_LOCAL_PORT}

services:
  postgres:
    restart: always
    # <<: *postgres-env
    env_file:
      - .env
    volumes: 
      # - "${DATA_DIR}/.local_data/postgresql:/var/lib/postgresql"
      - ".local_data/postgresql:/var/lib/postgresql"

  redis:
    restart: always
    # <<: *redis-env
    env_file:
      - .env
    volumes: !override
      # - "${DATA_DIR}/.local_data/redis:/data/"
      - .local_data/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - .local_data/redis/data:/data/
